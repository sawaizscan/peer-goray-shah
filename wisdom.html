  </div>

  <script src="app.js"></script>
  <script>
    (function() {
      var ALL = [];
      var dataLoaded = false;

      function loadData() {
        // Try localStorage first
        var stored = localStorage.getItem('peer_wisdom_data');
        var storedDate = localStorage.getItem('peer_wisdom_date');
        var today = new Date().toDateString();

        if (stored && storedDate === today) {
          try { ALL = JSON.parse(stored); dataLoaded = true; return; } catch(e) {}
        }

        // Fetch fresh
        var xhr = new XMLHttpRequest();
        xhr.open('GET', 'data.json', true);
        xhr.onload = function() {
          try {
            ALL = JSON.parse(xhr.responseText);
            dataLoaded = true;
            localStorage.setItem('peer_wisdom_data', xhr.responseText);
            localStorage.setItem('peer_wisdom_date', today);
            init();
          } catch(e) { console.error('JSON parse error'); }
        };
        xhr.onerror = function() { console.error('Failed to load data.json'); };
        xhr.send();
      }

      function init() {
        if (!dataLoaded || !ALL.length) return;

        // ─── TODAY'S RAREST ───
        var rarestPool = ALL.filter(function(d) { return d.rarity === 'Nadir-tareen'; });
        if (rarestPool.length) {
          var dayIndex = new Date().getDate() % rarestPool.length;
          var r = rarestPool[dayIndex];
          var rc = document.getElementById('rarestContainer');
          rc.innerHTML =
            '<div class="rarest-section">' +
            '<div class="badge"><i class="fas fa-gem"></i> نادر ترین · Today's Rarest</div>' +
            '<div class="ra">' + r.original + '</div>' +
            '<div class="ru">' + r.urdu + '</div>' +
            '<div class="r-meta">' +
            '<span><i class="fas fa-user"></i> ' + r.source_person + '</span>' +
            '<span><i class="fas fa-tag"></i> ' + r.category + '</span>' +
            '<span><i class="fas fa-book"></i> ' + r.makhaz + '</span>' +
            '</div></div>';
        }

        // ─── FILTERS ───
        var cats = [...new Set(ALL.map(function(d) { return d.category; }))];
        var sources = [...new Set(ALL.map(function(d) { return d.source_person; }))];
        var rarities = [...new Set(ALL.map(function(d) { return d.rarity; }))];
        var rarityLabels = { 'Nadir': 'نادر', 'Khas': 'خاص', 'Nadir-tareen': 'نادر ترین' };

        var activeCat = '', activeSource = '', activeRarity = '', searchQ = '';

        function buildFilter(containerId, items, labelMap, prefix, activeVar) {
          var c = document.getElementById(containerId);
          if (!c) return;
          var html = '<button class="filter-btn active" data-key="" data-prefix="' + prefix + '">All</button>';
          items.forEach(function(item) {
            html += '<button class="filter-btn" data-key="' + item + '" data-prefix="' + prefix + '">' + (labelMap && labelMap[item] ? labelMap[item] : item) + '</button>';
          });
          c.innerHTML = html;

          c.addEventListener('click', function(e) {
            var btn = e.target.closest('.filter-btn');
            if (!btn) return;
            c.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
            btn.classList.add('active');
            var prefix = btn.dataset.prefix;
            var key = btn.dataset.key;
            if (prefix === 'cat') activeCat = key;
            else if (prefix === 'src') activeSource = key;
            else if (prefix === 'rar') activeRarity = key;
            render();
          });
        }

        buildFilter('categoryFilters', cats, null, 'cat', activeCat);
        buildFilter('sourceFilters', sources, null, 'src', activeSource);
        buildFilter('rarityFilters', rarities, rarityLabels, 'rar', activeRarity);

        // ─── SEARCH ───
        document.getElementById('wisdomSearch').addEventListener('input', function(e) {
          searchQ = e.target.value.toLowerCase();
          render();
        });

        // ─── RENDER ───
        function render() {
          var filtered = ALL;
          if (activeCat) filtered = filtered.filter(function(d) { return d.category === activeCat; });
          if (activeSource) filtered = filtered.filter(function(d) { return d.source_person === activeSource; });
          if (activeRarity) filtered = filtered.filter(function(d) { return d.rarity === activeRarity; });
          if (searchQ) {
            filtered = filtered.filter(function(d) {
              return (d.original && d.original.toLowerCase().includes(searchQ)) ||
                     (d.urdu && d.urdu.includes(searchQ)) ||
                     (d.source_person && d.source_person.toLowerCase().includes(searchQ)) ||
                     (d.makhaz && d.makhaz.toLowerCase().includes(searchQ));
            });
          }

          document.getElementById('resultCount').textContent = filtered.length + ' of ' + ALL.length + ' entries';
          var grid = document.getElementById('wisdomGrid');
          var empty = document.getElementById('emptyState');

          if (!filtered.length) {
            grid.innerHTML = '';
            empty.style.display = 'block';
            return;
          }
          empty.style.display = 'none';

          grid.innerHTML = filtered.map(function(d) {
            var rarityClass = d.rarity === 'Nadir-tareen' ? 'Nadir-tareen' : (d.rarity === 'Khas' ? 'Khas' : 'Nadir');
            return '<div class="card">' +
              '<div class="card-header">' +
                '<span class="cat">' + d.category + '</span>' +
                '<span class="rarity ' + rarityClass + '">' + (rarityLabels[d.rarity] || d.rarity) + '</span>' +
              '</div>' +
              '<div class="source-person"><i class="fas fa-user"></i> ' + d.source_person + '</div>' +
              '<div class="original">' + d.original + '</div>' +
              '<div class="urdu">' + d.urdu + '</div>' +
              '<div class="ishraq-section"><div class="label"><i class="fas fa-sun"></i> اشراق</div><div class="content">' + d.ishraqat + '</div></div>' +
              '<div class="tanaquz-section"><div class="label"><i class="fas fa-balance-scale"></i> تناقض</div><div class="content">' + d.tanaquz + '</div></div>' +
              '<div class="related-section"><div class="label">متعلقہ قول</div><div class="content">' + d.related + '</div></div>' +
              '<div class="meta"><span><i class="fas fa-book"></i> ' + d.makhaz + '</span></div>' +
            '</div>';
          }).join('');
        }

        render();
      }

      loadData();
    })();
  </script>
