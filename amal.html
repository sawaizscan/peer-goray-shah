<body>

    <h1>اعمال · وظائف · اوراد</h1>

  <section class="section" style="background: var(--white);">
    <div class="section-inner">

      <div class="filters" id="amalFilters"></div>
      <div class="count-badge" id="amalCount"></div>
      <div id="amalList"></div>
      <div class="empty-state" id="amalEmpty" style="display:none;">

  </div>

  <script src="app.js"></script>
  <script>
    (function() {
      var ALL = [];
      var catLabels = {
        'Hifazat': 'حفاظت',
        'Taskhir': 'تسخیر',
        'Rizq': 'رزق',
        'Sehr': 'سحر و آسیب'
      };

      function loadData() {
        var stored = localStorage.getItem('peer_amal_data');
        var storedDate = localStorage.getItem('peer_amal_date');
        var today = new Date().toDateString();

        if (stored && storedDate === today) {
          try { ALL = JSON.parse(stored); init(); return; } catch(e) {}
        }

        var xhr = new XMLHttpRequest();
        xhr.open('GET', 'amal.json', true);
        xhr.onload = function() {
          try {
            ALL = JSON.parse(xhr.responseText);
            localStorage.setItem('peer_amal_data', xhr.responseText);
            localStorage.setItem('peer_amal_date', today);
            init();
          } catch(e) { console.error('JSON parse error'); }
        };
        xhr.onerror = function() { console.error('Failed to load amal.json'); };
        xhr.send();
      }

      function init() {
        if (!ALL.length) return;

        var cats = [...new Set(ALL.map(function(d) { return d.category; }))];

        // filter buttons
        var container = document.getElementById('amalFilters');
        container.innerHTML = '<button class="filter-btn active" data-cat="">All</button>' +
          cats.map(function(c) {
            return '<button class="filter-btn" data-cat="' + c + '">' + (catLabels[c] || c) + '</button>';
          }).join('');

        var activeCat = '';

        container.addEventListener('click', function(e) {
          var btn = e.target.closest('.filter-btn');
          if (!btn) return;
          container.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
          btn.classList.add('active');
          activeCat = btn.dataset.cat || '';
          render();
        });

        function render() {
          var filtered = activeCat ? ALL.filter(function(d) { return d.category === activeCat; }) : ALL;
          document.getElementById('amalCount').textContent = filtered.length + ' of ' + ALL.length + ' practices';
          var list = document.getElementById('amalList');
          var empty = document.getElementById('amalEmpty');

          if (!filtered.length) {
            list.innerHTML = '';
            empty.style.display = 'block';
            return;
          }
          empty.style.display = 'none';

          var catIcons = { 'Hifazat': 'fa-shield-halved', 'Taskhir': 'fa-heart', 'Rizq': 'fa-coins', 'Sehr': 'fa-cross' };

          list.innerHTML = filtered.map(function(d) {
            return '<div class="card" style="margin-bottom:1.25rem;">' +
              '<div class="card-header">' +
                '<span class="cat"><i class="fas ' + (catIcons[d.category] || 'fa-star') + '"></i> ' + (catLabels[d.category] || d.category) + '</span>' +
                '<span style="font-size:0.6rem;color:var(--text-muted);">' + d.source_book + '</span>' +
              '</div>' +
              '<div class="original" style="text-align:center;">' + d.original + '</div>' +
              '<div class="urdu" style="text-align:center;color:var(--text);">' + d.urdu + '</div>' +
              '<div style="margin:0.75rem 0;padding:0.75rem;background:rgba(10,74,42,0.04);border-radius:8px;border-right:2px solid var(--primary);">' +
                '<div style="font-size:0.6rem;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--primary);margin-bottom:0.3rem;"><i class="fas fa-list-check"></i> طریقہ · Methodology</div>' +
                '<div style="font-size:0.82rem;color:var(--text);line-height:1.7;direction:rtl;font-family:\'Noto Nastaliq Urdu\',serif;">' + d.methodology + '</div>' +
              '</div>' +
              '<div class="meta"><span><i class="fas fa-book"></i> ' + d.source_ref + '</span></div>' +
            '</div>';
          }).join('');
        }

        render();
      }

      loadData();
    })();
  </script>
</body>
</html>
