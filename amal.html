  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    (function() {
      const ALL = AMAL_DATA;
      const cats = [...new Set(ALL.map(d => d.category))];
      let activeCat = null;

      function render() {
        const filtered = activeCat ? ALL.filter(d => d.category === activeCat) : ALL;
        document.getElementById('amalCount').textContent = filtered.length + ' of ' + ALL.length + ' practices';
        const list = document.getElementById('amalList');
        const empty = document.getElementById('amalEmpty');

        if (filtered.length === 0) {
          list.innerHTML = '';
          empty.style.display = 'block';
          return;
        }
        empty.style.display = 'none';

        list.innerHTML = filtered.map(d => {
          const isRtl = d.language === 'ar' || d.language === 'fa' || d.language === 'ur';
          const cls = isRtl ? '' : ' en';
          return `<div class="amal-card">
            <div class="amal-header">
              <h3>${d.category} · ${d.source}</h3>
              <div class="amal-cats"><span>${d.category}</span><span>${d.language}</span></div>
            </div>
            <div class="amal-text${cls}">${d.text_original}</div>
            <div class="amal-trans">${d.text_urdu}</div>
            <div class="amal-source">
              <span>${d.author}</span>
              <span>${d.source}</span>
            </div>
          </div>`;
        }).join('');
      }

      // filters
      const container = document.getElementById('amalFilters');
      container.innerHTML = '<button class="filter-btn active" data-cat="">All</button>' +
        cats.map(c => `<button class="filter-btn" data-cat="${c}">${c}</button>`).join('');

      container.addEventListener('click', e => {
        const btn = e.target.closest('.filter-btn');
        if (!btn) return;
        container.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeCat = btn.dataset.cat || null;
        render();
      });

      render();
    })();
  </script>
</body>
</html>
