name: News Aggregator

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  aggregate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run news aggregator
        run: python .github/scripts/news_aggregator.py
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}

      - name: Commit and push news.json
        run: |
          git config user.name "News Aggregator Bot"
          git config user.email "bot@pirgorayshah.live"
          git add news.json
          git diff --cached --exit-code --quiet || (
            git commit -m "Auto-update news.json [$(date -u +'%Y-%m-%d %H:%M UTC')]" &&
            git push
          )
