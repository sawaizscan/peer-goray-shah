name: Auto-Update Content

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate daily a'mal & poetry & duas
        run: python3 scripts/generate_daily.py

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Generate daily wisdom content
        run: |
          TODAY=$(date -u '+%Y-%m-%d')
          php -r "
            require 'scripts/daily_wisdom.php';
            \$engine = new DailyWisdomEngine(__DIR__);
            \$output = \$engine->generate();
            file_put_contents(
              'data_v2/daily_wisdom_' . \$output['date'] . '.json',
              json_encode(\$output, JSON_UNESCAPED_UNICODE | JSON_PRETTY_PRINT)
            );
            echo 'Generated: data_v2/daily_wisdom_' . \$output['date'] . '.json (' . \$output['stats']['total'] . ' entries)\n';
          "

      - name: Commit and push changes
        run: |
          git config user.name "Content Bot"
          git config user.email "bot@peer-goray-shah.github.io"
          git add amal.json poetry.json duas_daily.json
          git add data_v2/daily_wisdom_*.json
          git diff --quiet && git diff --staged --quiet || \
            git commit -m "auto: refresh daily content $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
