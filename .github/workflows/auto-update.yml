name: Auto-Update Content

on:
  schedule:
    # Every 6 hours = 4x daily
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:  # manual trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate daily a'mal & poetry & duas
        run: python3 scripts/generate_daily.py

      - name: Commit and push changes
        run: |
          git config user.name "Content Bot"
          git config user.email "bot@peer-goray-shah.github.io"
          git add amal.json poetry.json duas_daily.json
          git diff --quiet && git diff --staged --quiet || \
            git commit -m "auto: refresh daily amal, poetry & duas $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
